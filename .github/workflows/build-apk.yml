name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Zeno Editor APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages for Capacitor
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Prepare Android platform
        run: |
          if [ -d android ] && [ ! -f android/app/build.gradle ]; then
            echo "Removing incomplete android folder..."
            rm -rf android
          fi
          if [ ! -d android ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Apply Zeno app icon (neon Z)
        run: |
          set -e
          for density_size in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${density_size%%:*}"
            size="${density_size##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert -background none -density 300 resources/icon.svg -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
          done
          mkdir -p android/app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="ic_launcher_background">#0E0E10</color>' '</resources>' > android/app/src/main/res/values/ic_launcher_background.xml
          mkdir -p src/assets/icon
          convert -background none -density 300 resources/icon.svg -resize 192x192 src/assets/icon/favicon.png || true
          convert -background none -density 300 resources/icon.svg -resize 512x512 src/assets/icon/logo.png || true
          echo "Icons applied."
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeno-editor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload to GitHub Release (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Zeno Editor APK v${{ github.run_number }}
          draft: false
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automated build of Zeno Editor (debug APK)
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
